<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новости — NORDLINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="grain"></div>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="container">
      <div class="crumbs"><a href="index.html">Главная</a><span>/</span><span>Новости</span></div>
      <p class="eyebrow">Поставки и акции</p>
      <h1>Что нового</h1>
    </div>
  </section>
  <section class="section" style="padding-top:8px;">
    <div class="container catalog-grid" id="news"></div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script>
    document.getElementById("news").innerHTML = NORDLINE_DATA.news.map(function (item) {
      return '<a class="card" href="article.html?id=' + item.id + '"><div class="card-media"><img src="' + item.image + '" alt=""></div><div class="card-body"><div class="brand">' + item.date + '</div><h3>' + item.title + '</h3><p class="muted">' + item.lead + '</p></div></a>';
    }).join("");
  </script>
</body>
</html>
