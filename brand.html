<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бренд — NORDLINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">
  <div class="grain"></div>
  <div id="site-header"></div>
  <section class="page-hero photo">
    <div class="hero-media"><img src="images/hero-sled.png" alt=""></div>
    <div class="container" style="position:relative;z-index:1;padding-bottom:36px;">
      <div class="crumbs"><a href="index.html">Главная</a><span>/</span><a href="catalog.html">Каталог</a><span>/</span><span id="brandCrumb">Бренд</span></div>
      <p class="eyebrow">Линейка</p>
      <h1 id="brandTitle">Бренд</h1>
      <p class="hero-lead" id="brandLead"></p>
    </div>
  </section>
  <section class="section" style="padding-top:20px;">
    <div class="container">
      <div class="filters" id="brandNav"></div>
      <div class="catalog-grid" id="catalog"></div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script>
    (function () {
      var api = window.nordline;
      var data = window.NORDLINE_DATA;
      var id = api.qs("id") || "ski-doo";
      var brand = data.brands.filter(function (item) { return item.id === id; })[0] || data.brands[0];
      document.title = brand.name + " — NORDLINE";
      document.getElementById("brandTitle").textContent = brand.name;
      document.getElementById("brandCrumb").textContent = brand.name;
      document.getElementById("brandLead").textContent = brand.text;
      document.getElementById("brandNav").innerHTML = data.brands.map(function (item) {
        return '<a class="chip' + (item.id === brand.id ? " active" : "") + '" href="brand.html?id=' + item.id + '">' + item.name + "</a>";
      }).join("");
      document.getElementById("catalog").innerHTML = api.getModels().filter(function (model) {
        return model.brandId === brand.id;
      }).map(api.cardHtml).join("");
    })();
  </script>
</body>
</html>
