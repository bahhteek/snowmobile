<body>
  <div class="grain"></div>

  <script>

    document.getElementById("article").innerHTML =

      '<div class="prose"><p>' + item.lead + '</p><p>Это демо-текст статьи для показа клиенту. В продакшене здесь будут поставки, условия акции и кнопка заявки.</p></div>' +
