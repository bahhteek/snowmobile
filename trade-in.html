<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трейд-ин — NORDLINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="grain"></div>
  <div id="site-header"></div>
  <section class="page-hero">
    <div class="container">
      <div class="crumbs"><a href="index.html">Главная</a><span>/</span><span>Трейд-ин</span></div>
      <p class="eyebrow">Зачёт вашей техники</p>
      <h1>Трейд-ин снегохода</h1>
      <p class="hero-lead">Оценим текущую машину и зачтём в счёт новой. Осмотр в салоне, предварительная оценка — по заявке.</p>
    </div>
  </section>
  <section class="section" style="padding-top:8px;">
    <div class="container" style="max-width:640px;">
      <form class="form panel" id="tradeForm">
        <input name="name" placeholder="Имя" required>
        <input name="phone" type="tel" placeholder="Телефон" required>
        <input name="model" placeholder="Ваша модель и год" required>
        <input name="hours" placeholder="Моточасы / состояние">
        <textarea name="comment" placeholder="На какую модель хотите пересесть"></textarea>
        <button class="btn btn-primary" type="submit">Отправить на оценку</button>
      </form>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script>
    document.getElementById("tradeForm").addEventListener("submit", function (e) {
      e.preventDefault(); this.reset(); nordline.toast("Заявку на оценку приняли.");
    });
  </script>
</body>
</html>
